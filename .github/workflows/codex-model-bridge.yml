name: Temporary Codex release URL probe

on:
  push:
    paths:
      - ".github/workflows/codex-model-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve public release asset URL
        run: |
          set -euo pipefail
          url="https://github.com/offyotto/qwen3.8-27b-ud-q3-k-xl/releases/download/v1.0.0/Qwen3.8-27B-UD-Q3_K_XL.gguf.part-01"
          resolved="$(curl -L --fail --range 0-0 --output /dev/null --silent --show-error --write-out '%{url_effective}' "$url")"
          printf 'RESOLVED_URL_B64='
          printf '%s' "$resolved" | base64 -w0
          printf '\n'
